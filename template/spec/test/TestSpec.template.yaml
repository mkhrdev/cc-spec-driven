# TestSpec Template
# File naming:
#   Simple:  TEST-1.0.0.yaml
#   Complex: TEST-1.0.0-{feature}.yaml

# ============================================================
# META (Required at top for context-efficient loading)
# ============================================================
_meta:
  id: "TEST-{VERSION}"  # or TEST-{VERSION}-{feature}
  title: "{Feature} Test Suite"
  status: draft  # draft | ready | executing | passed | failed
  version: "{VERSION}"
  summary: "{2-3 sentence summary of test coverage}"
  refs:
    product: "PRD-{VERSION}"
  checksum: null

# ============================================================
# METADATA
# ============================================================
metadata:
  created_at: "{timestamp}"
  updated_at: "{timestamp}"
  generated_by: "/test-build"
  last_executed: null

# ============================================================
# TRACEABILITY
# ============================================================
generated_from:
  product:
    id: "PRD-{VERSION}"
    path: "../product/PRD-{VERSION}.yaml"
    checksum: "sha256:{checksum}"
    generated_at: "{timestamp}"

# ============================================================
# COVERAGE MAPPING
# ============================================================
coverage:
  requirements:
    - requirement_id: FR-001
      requirement_title: "{Title}"
      acceptance_criteria:
        - criterion: "{Criterion text}"
          test_cases: [TC-001]
          coverage: full  # full | partial | none

  summary:
    total_requirements: 0
    fully_covered: 0
    partially_covered: 0
    not_covered: 0

# ============================================================
# ENVIRONMENT
# ============================================================
environment:
  prerequisites: []
  env_vars: []
  test_data: []
  cleanup: []

# ============================================================
# TEST SUITES
# ============================================================
# For E2E flows: use type: e2e and define user journey as sequential test_cases
# Example E2E flow: Login → View Profile → Update Settings → Logout
test_suites:
  - id: TS-001
    name: "{Suite Name}"
    type: e2e  # unit | integration | e2e | performance | regression
    description: |
      {What this suite covers}
    covers:
      requirements: []
    target_repos: []
    # For e2e type: define the user journey
    user_journey: "{Brief description of the flow, e.g., 'Complete login flow'}"

    test_cases:
      - id: TC-001
        title: "{Test Case Title}"
        description: |
          {What this test verifies}
        priority: critical  # critical | high | medium | low
        type: positive  # positive | negative | edge_case

        preconditions: []

        steps:
          - step: 1
            action: |
              {What to do}
            expected: |
              {Expected result}

        postconditions: []
        test_data: []
        tags: []

        automation:
          status: pending  # pending | automated | manual_only
          script_path: null

# ============================================================
# EXECUTION RESULTS
# ============================================================
# Note: E2E flows are represented as test_suites with type: e2e
# Each e2e suite can define a user journey through its test_cases
execution_results:
  latest: null
  history: []

# ============================================================
# FAILURE ANALYSIS
# ============================================================
failure_analysis: []

# ============================================================
# CHANGELOG (Required for auditability)
# ============================================================
# Every iteration MUST be recorded, including:
# - iteration: counter for tracking draft iterations
# - trigger: what initiated the change
# - sections_modified: which parts were changed
#
# See docs/revision-handling.md#draft-auditability for details.
# ============================================================
changelog:
  - version: "{VERSION}"
    date: "{date}"
    iteration: 1
    status: draft
    changes:
      - type: created
        description: "Initial TestSpec generation"
        trigger:
          type: generated
          content: "Generated from PRD-{VERSION}"
        sections_modified: ["all"]

# ============================================================
# REVIEW NOTES
# ============================================================
review_notes: []
