# Project Configuration for: template
# This file defines product-level settings, repository mappings, and tech stacks

version: "1.0"

product:
  name: "template"
  description: "Template product for spec-driven development demonstration"
  primary_language: en  # Primary spec language (en, zh, ja)
  supported_languages:
    - en
    - zh
    - ja

# Repository Mapping
# Define all repositories involved in this product
repos:
  frontend:
    path: "../frontend"                    # Relative path from spec repo
    description: "Web frontend application"
    tech_stack:
      language: typescript
      framework: react
      build_tool: vite
      test_framework: vitest
    patterns:
      components: "src/components/**/*.tsx"
      pages: "src/pages/**/*.tsx"
      hooks: "src/hooks/**/*.ts"
      api_client: "src/api/**/*.ts"
      types: "src/types/**/*.ts"
    conventions:
      naming: kebab-case
      state_management: zustand
      styling: tailwind

  backend:
    path: "../backend"
    description: "API backend service"
    tech_stack:
      language: go
      framework: gin
      database: postgresql
      test_framework: go test
    patterns:
      handlers: "internal/handlers/**/*.go"
      services: "internal/services/**/*.go"
      repositories: "internal/repositories/**/*.go"
      models: "internal/models/**/*.go"
      migrations: "migrations/*.sql"
    conventions:
      naming: snake_case
      api_style: REST
      error_handling: structured

  shared:
    path: "../shared"
    description: "Shared types and utilities"
    tech_stack:
      language: typescript
    patterns:
      types: "src/types/**/*.ts"
      utils: "src/utils/**/*.ts"

# Repository Groups (for batch operations)
repo_groups:
  all_backend:
    description: "All backend services"
    repos:
      - backend
      # Add more backend repos here

  all_frontend:
    description: "All frontend applications"
    repos:
      - frontend

  all:
    description: "All repositories"
    repos:
      - frontend
      - backend
      - shared

# Environment Configuration
environments:
  development:
    frontend_url: "http://localhost:3000"
    backend_url: "http://localhost:8080"

  staging:
    frontend_url: "https://staging.example.com"
    backend_url: "https://api.staging.example.com"

  production:
    frontend_url: "https://example.com"
    backend_url: "https://api.example.com"

# Spec Configuration
spec_config:
  # Auto-generate checksum on save
  auto_checksum: true

  # Require review before approval
  require_review: true

  # Maximum adjustment rounds before escalation
  # 0 = always require human decision (default)
  # n = allow up to n automatic rounds
  max_adjustment_rounds: 0
