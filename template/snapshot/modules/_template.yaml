# Module: {module_id}
# Load this file when working on this specific module
#
# File naming: modules/{module_id}.yaml

_meta:
  id: "{module_id}"
  name: "{Module Name}"
  last_updated: "{timestamp}"
  source_specs: []                    # PRD IDs that defined this module

summary: |
  {2-3 sentences: what this module does, core responsibilities}

# Features in this module
features:
  - id: "{feature_id}"
    name: "{Feature Name}"
    summary: "{1-2 sentences}"
    status: active                    # active | planned | deprecated
    source_specs: [PRD-x.x.x-xxx]

    # Implementation details - the fine-grained info
    details:
      # UI Forms
      forms:
        - name: "{form_name}"
          purpose: "{what this form does}"
          fields:
            - name: "{field_name}"
              type: text              # text | email | password | select | checkbox | ...
              validation: "{rules}"
              required: true

      # API Endpoints
      apis:
        - endpoint: "{METHOD} {path}"
          purpose: "{what this API does}"
          auth_required: true
          request:
            - field: "{name}"
              type: "{type}"
              validation: "{rules}"
          response:
            success: "{structure}"
            errors: ["{error cases}"]

      # Business Rules
      rules:
        - rule: "{rule description}"
          condition: "{when this applies}"

      # State/Data
      state:
        - name: "{state name}"
          type: "{type}"
          persistence: session        # session | local | server
