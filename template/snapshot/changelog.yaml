# Snapshot Changelog
# Load only when need to understand evolution history
#
# Each entry records what changed and which spec triggered it

entries:
  - version: 1
    date: "{date}"
    trigger:
      type: cold_start                    # cold_start | spec_approved | manual
      spec_id: null                       # PRD-x.x.x-xxx (if spec_approved)
      spec_checksum: null                 # sha256:... (if spec_approved)
    changes:
      - module: "{module_id}"
        feature: null                     # or feature_id if feature-level change
        type: added                       # added | modified | removed
        description: "{what changed}"
